name: Validate and deploy BAI IT Support

on:
  push:
    branches: [main]
    paths:
      - "BAI-IT-Support-Cloudflare-Pages/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "wrangler.jsonc"
  pull_request:
    paths:
      - "BAI-IT-Support-Cloudflare-Pages/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and D1 migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BAI-IT-Support-Cloudflare-Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application JavaScript
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/auth.js
          node --check public/discussion.js

      - name: Validate Worker entry point
        run: node --check src/worker.js

      - name: Validate all D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("migrations").glob("*.sql")):
              db.executescript(migration.read_text())
              print(f"Validated {migration.name}")
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"users", "tickets", "ticket_hold_periods", "ticket_comments", "ticket_attachments", "ticket_events", "audit_logs", "sessions"}
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing expected tables: {sorted(missing)}")
          columns = {row[1] for row in db.execute("PRAGMA table_info(tickets)")}
          required_columns = {"rejected_at", "assignment_mode", "assigned_by", "assigned_at"}
          if required_columns - columns:
              raise SystemExit(f"Missing ticket columns: {sorted(required_columns - columns)}")
          print(f"All SQL migrations valid; {len(tables)} tables checked.")
          PY

      - name: Validate Wrangler configuration
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(c.name!=='bai-it-support'||!c.assets?.binding||!c.d1_databases?.some(x=>x.binding==='DB'&&x.database_id)) process.exit(1); console.log('Worker, static assets, and D1 configuration valid.')"

  deploy:
    name: Deploy Worker, static app, and D1
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BAI-IT-Support-Cloudflare-Pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub Secret CLOUDFLARE_API_TOKEN belum tersedia."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub Secret CLOUDFLARE_ACCOUNT_ID belum tersedia."; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Cloudflare account and configured D1 binding
        shell: bash
        run: |
          set -euo pipefail
          wrangler whoami
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const database = config.d1_databases?.find(item => item.binding === 'DB');
          if (!database?.database_name || !database?.database_id) {
            throw new Error('Konfigurasi D1 binding DB belum memiliki database_name dan database_id.');
          }
          console.log('Worker:', config.name);
          console.log('D1 binding DB ditemukan:', database.database_name);
          NODE

      - name: Apply D1 migrations
        run: wrangler d1 migrations apply bai-it-support-kpi-db --remote --config wrangler.jsonc

      - name: Deploy Worker and static application
        run: wrangler deploy --config wrangler.jsonc

      - name: Verify live application and database
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://bai-it-support.sumarewbarbosa.workers.dev/api/health -o health.json; then
              cat health.json
              node -e "const h=require('./health.json'); if(!h.ok||!h.worker||!h.database||!h.schema_ready) process.exit(1)"
              curl --fail --silent --show-error https://bai-it-support.sumarewbarbosa.workers.dev/ -o homepage.html
              grep -qi '<html' homepage.html
              if grep -qi 'Hello World' homepage.html; then echo "::error::Worker masih menyajikan halaman Hello World."; exit 1; fi
              echo "Live Worker, D1 schema, and application homepage verified."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check Worker gagal setelah beberapa percobaan."
          exit 1
